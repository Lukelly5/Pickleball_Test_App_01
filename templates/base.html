{% load static tailwind_cli %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Stryde</title>
  <link rel="icon" href="{% static 'brand/stryde-monogram.svg' %}" type="image/svg+xml">
  <style>
    @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap;
      src: url("{% static 'fonts/inter-latin-wght-normal.woff2' %}") format("woff2"); }
    @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 700; font-display: swap;
      src: url("{% static 'fonts/montserrat-latin-700-normal.woff2' %}") format("woff2"); }
    @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 800; font-display: swap;
      src: url("{% static 'fonts/montserrat-latin-800-normal.woff2' %}") format("woff2"); }
  </style>
  {% tailwind_css %}
  <script src="{% static 'vendor/htmx-2.0.11.min.js' %}" defer></script>
  <script src="{% static 'vendor/basecoat-1.1.0/basecoat.min.js' %}" defer></script>
  <script src="{% static 'vendor/basecoat-1.1.0/dropdown-menu.min.js' %}" defer></script>
  <script src="{% static 'vendor/basecoat-1.1.0/toast.min.js' %}" defer></script>
</head>
<body class="min-h-screen bg-background text-foreground font-sans antialiased {% block body_class %}{% endblock %}" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block body %}{% endblock %}
  <div id="toaster" class="toaster">
    {% for message in messages %}
    <div class="toast" role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}" aria-atomic="true" data-category="{{ message.level_tag }}">
      <div class="toast-content">
        <section><p>{{ message }}</p></section>
      </div>
    </div>
    {% endfor %}
  </div>
</body>
</html>
