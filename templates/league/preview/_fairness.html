<section id="fairness" class="card grid gap-3 p-4" aria-label="Fairness">
  <h2 class="text-sm font-extrabold text-ink">Fairness · Week {{ board.week }}</h2>
  {% for block in fairness %}
  <div class="grid gap-1">
    <h3 class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">{{ block.flight_name }}</h3>
    <dl class="flex flex-wrap gap-x-6 gap-y-1 text-sm">
      {% for line in block.lines %}
      <div class="flex items-center gap-1.5">
        <dt class="text-muted-foreground">{{ line.label }}:</dt>
        <dd class="text-ink">{{ line.text }}{% if line.ok %} <span aria-hidden="true">✓</span><span class="sr-only">even</span>{% endif %}</dd>
        {% if line.chip %}<span class="rounded-full bg-warn-bg px-2 text-xs font-semibold text-warn">{{ line.chip }}</span>{% endif %}
      </div>
      {% endfor %}
    </dl>
  </div>
  {% endfor %}
</section>
