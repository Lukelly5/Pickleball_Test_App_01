{% extends "base_public.html" %}
{% block title %}Reset your password{% endblock %}
{% block content %}
<div class="card px-6 py-8">
  <h1 class="text-2xl font-extrabold text-ink">Reset your password</h1>
  <p class="mt-1 text-sm text-muted-foreground">Enter your email and we'll send you a reset link.</p>
  <form method="post" class="form mt-6 grid gap-5" novalidate>
    {% csrf_token %}
    {% include "components/form_field.html" with field=form.email only %}
    <button type="submit" class="btn w-full" data-size="lg">Send reset link</button>
  </form>
  <p class="mt-5 text-center text-sm"><a href="{% url 'login' %}" class="font-semibold text-brand hover:underline">Back to log in</a></p>
</div>
{% endblock %}
